<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 200" width="156" height="200">
  <defs>
    <linearGradient id="speaker-wood" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d9b184"/><stop offset=".5" stop-color="#b98a58"/><stop offset="1" stop-color="#8d6238"/></linearGradient>
    <linearGradient id="speaker-cav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2d32"/><stop offset="1" stop-color="#3d4248"/></linearGradient>
    <linearGradient id="speaker-steel" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#9aa1a9"/><stop offset="1" stop-color="#4c535b"/></linearGradient>
    <linearGradient id="speaker-mag" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a5f66"/><stop offset=".5" stop-color="#2a2d31"/><stop offset="1" stop-color="#121416"/></linearGradient>
    <linearGradient id="speaker-cone" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8a9097"/><stop offset=".5" stop-color="#454a50"/><stop offset="1" stop-color="#1e2125"/></linearGradient>
    <linearGradient id="speaker-pole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe3e7"/><stop offset=".5" stop-color="#8d949c"/><stop offset="1" stop-color="#4c535b"/></linearGradient>
    <linearGradient id="speaker-cu" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#d98f2b"/><stop offset="1" stop-color="#8f5410"/></linearGradient>
    <radialGradient id="speaker-cap" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#9aa0a7"/><stop offset=".55" stop-color="#4a4f56"/><stop offset="1" stop-color="#1c1f23"/></radialGradient>
    <filter id="speaker-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="78" cy="196" rx="74" ry="3.5" fill="#2b2418" opacity=".28" filter="url(#speaker-blur)"/>
  <!-- cabinet in section: dark cavity, then thick cut walls (top, bottom, back, front baffle) with grain, bevel and rounded corners -->
  <rect x="5" y="10" width="144" height="180" rx="8" fill="url(#speaker-cav)" stroke="#2a1d10" stroke-width="1"/>
  <rect x="19" y="28" width="118" height="6" fill="#000" opacity=".28"/>
  <rect x="19" y="166" width="118" height="6" fill="#000" opacity=".28"/>
  <!-- top wall -->
  <path d="M5 18a8 8 0 0 1 8-8h128a8 8 0 0 1 8 8v10H5z" fill="url(#speaker-wood)" stroke="#2a1d10" stroke-width="1"/>
  <!-- bottom wall -->
  <path d="M5 172h144v10a8 8 0 0 1-8 8H13a8 8 0 0 1-8-8z" fill="url(#speaker-wood)" stroke="#2a1d10" stroke-width="1"/>
  <!-- back wall -->
  <path d="M5 28h14v144H5z" fill="url(#speaker-wood)" stroke="#2a1d10" stroke-width="1"/>
  <!-- front baffle (holds the driver): opening y38…162 for the cone -->
  <path d="M136 28h13v10h-13zM136 162h13v10h-13z" fill="url(#speaker-wood)" stroke="#2a1d10" stroke-width="1"/>
  <path d="M136 38h13v124" fill="none" stroke="#2a1d10" stroke-width="0"/>
  <rect x="136" y="38" width="3" height="124" fill="#1b130b" opacity=".55"/>
  <!-- wood grain on the cut walls -->
  <path d="M10 15.5h134M8 21h138M8 25h138M8 175.5h138M8 180h134M10 185h130" stroke="#7a5230" stroke-width=".5" opacity=".55" fill="none"/>
  <path d="M8.5 34v132M12 32v136M16 32v136" stroke="#7a5230" stroke-width=".5" opacity=".5" fill="none"/>
  <path d="M138 31h9M138 35h9M138 165h9M138 169h9" stroke="#7a5230" stroke-width=".5" opacity=".55" fill="none"/>
  <!-- bevel highlights + inner shadow lines -->
  <path d="M9 12.5h132" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
  <path d="M147.5 20v6M147.5 174v6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".35"/>
  <path d="M19 34v132" stroke="#000" stroke-width="1" opacity=".35"/>
  <!-- screws holding the basket flange on the baffle -->
  <circle cx="142.5" cy="32.5" r="1.6" fill="#b9c0c8" stroke="#30353b" stroke-width=".5"/>
  <circle cx="142.5" cy="167.5" r="1.6" fill="#b9c0c8" stroke="#30353b" stroke-width=".5"/>
  <!-- rubber feet -->
  <rect x="14" y="190" width="22" height="4" rx="2" fill="#26231f"/>
  <rect x="118" y="190" width="22" height="4" rx="2" fill="#26231f"/>
  <!-- foam lining on the back wall -->
  <path d="M19 40l7 6-7 6 7 6-7 6 7 6-7 6zM19 130l7 6-7 6 7 6-7 6 7 6-7 6z" fill="#6c727a" opacity=".55"/>
  <!-- magnet assembly (static): back plate, magnet ring, top plate, pole piece -->
  <rect x="19" y="64" width="8" height="72" fill="url(#speaker-steel)" stroke="#30353b" stroke-width=".8"/>
  <rect x="27" y="64" width="30" height="24" rx="1.5" fill="url(#speaker-mag)" stroke="#0e0f11" stroke-width=".8"/>
  <rect x="27" y="112" width="30" height="24" rx="1.5" fill="url(#speaker-mag)" stroke="#0e0f11" stroke-width=".8"/>
  <rect x="57" y="64" width="9" height="24" fill="url(#speaker-steel)" stroke="#30353b" stroke-width=".8"/>
  <rect x="57" y="112" width="9" height="24" fill="url(#speaker-steel)" stroke="#30353b" stroke-width=".8"/>
  <rect x="27" y="92" width="58" height="16" fill="url(#speaker-pole)" stroke="#30353b" stroke-width=".8"/>
  <rect x="29" y="94" width="54" height="2" fill="#fff" opacity=".55"/>
  <!-- basket (khung loa): flange on the baffle, arms to the top plate -->
  <path d="M132 34h8v7h-3L68 86v-8L132 34z" fill="url(#speaker-steel)" stroke="#30353b" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M132 166h8v-7h-3L68 114v8L132 166z" fill="url(#speaker-steel)" stroke="#30353b" stroke-width=".8" stroke-linejoin="round"/>
  <!-- cone, dust cap, voice coil (moving) -->
  <g id="cone" data-move="1">
    <path d="M146 44l-52 42 3 5 51-41z" fill="url(#speaker-cone)" stroke="#14161a" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M146 156l-52-42 3-5 51 41z" fill="url(#speaker-cone)" stroke="#14161a" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M144 45.4l-50 40.6" stroke="#fff" stroke-width=".9" opacity=".35"/>
    <path d="M96 85v30" stroke="#14161a" stroke-width=".8"/>
    <rect x="72" y="84" width="26" height="5" fill="url(#speaker-cu)" stroke="#6b3d08" stroke-width=".6"/>
    <rect x="72" y="111" width="26" height="5" fill="url(#speaker-cu)" stroke="#6b3d08" stroke-width=".6"/>
    <path d="M75 84v5M79 84v5M83 84v5M87 84v5M91 84v5M95 84v5M75 111v5M79 111v5M83 111v5M87 111v5M91 111v5M95 111v5" stroke="#6b3d08" stroke-width=".5" opacity=".8"/>
    <rect x="72" y="89" width="26" height="2" fill="#aab0b7"/>
    <rect x="72" y="109" width="26" height="2" fill="#aab0b7"/>
    <path d="M96 86q14 14 0 28z" fill="url(#speaker-cap)" stroke="#14161a" stroke-width=".8"/>
  </g>
  <!-- anchors (design units, rest position) -->
  <circle class="anchor" id="a-rimtop" cx="146" cy="44" r="0"/>
  <circle class="anchor" id="a-rimbot" cx="146" cy="156" r="0"/>
  <circle class="anchor" id="a-cone" cx="122" cy="65" r="0"/>
  <circle class="anchor" id="a-coil" cx="84" cy="85" r="0"/>
  <circle class="anchor" id="a-magnet" cx="42" cy="75" r="0"/>
  <circle class="anchor" id="a-basket" cx="108" cy="54" r="0"/>
  <circle class="anchor" id="a-fl-top" cx="138" cy="38" r="0"/>
  <circle class="anchor" id="a-fl-bot" cx="138" cy="162" r="0"/>
  <circle class="anchor" id="a-sp-top" cx="84" cy="76" r="0"/>
  <circle class="anchor" id="a-sp-bot" cx="84" cy="124" r="0"/>
</svg>
