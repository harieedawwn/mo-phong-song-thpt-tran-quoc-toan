  <path d="M206 132C202 134 201 140 204 143.5C207 146 212 146 214 144" fill="none" stroke="#b87458" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M213.5 143.5C216 142 220 142.5 222 144" fill="none" stroke="#7d4232" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M202 147C200 154 201 162 204 168" fill="none" stroke="#c4846a" stroke-width="1" opacity=".55"/>
  <path d="M212.5 152.5C215 154.8 217 157 217 159.5C217 162 214.5 164.2 211.5 165C211.8 161 212.4 156.5 212.5 152.5Z" fill="url(#hd-lip)"/>
  <path d="M211.5 165C214.5 166.5 215.6 170 215.3 174C215 177 212.5 178.6 209.8 178.2C211.4 174 211.8 169 211.5 165Z" fill="url(#hd-lip)"/>
  <path d="M206.5 165.2C208.5 164.6 210.5 164.8 211.8 165.1" fill="none" stroke="#8c4a44" stroke-width="1.1" stroke-linecap="round"/>
  <use href="#hd-sil" fill="none" stroke="#9c5b43" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- hair -->
  <path d="M40 166C26 142 18 112 22 84C30 32 76 1 122 2.5C160 3.5 188 18 194 42C186 38 176 40 168 46C152 52 138 62 130 78C126 88 125 98 124 108L119 112C116 104 112 96 104 92C96 88 86 90 79 98C70 110 62 128 58 146C55 156 50 163 40 166Z" fill="url(#hd-hair)" stroke="#221812" stroke-width=".8"/>
  <path d="M60 30C80 14 104 8 128 9" fill="none" stroke="#a08068" stroke-width="2" stroke-linecap="round" opacity=".45"/>

  <circle class="anchor" id="a-ear" cx="99.2" cy="123.5" r="0"/>
  <circle class="anchor" id="a-mouth" cx="211.5" cy="165" r="0"/>
</svg>
