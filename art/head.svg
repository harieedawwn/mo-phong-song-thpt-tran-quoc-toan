<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 300" width="232" height="300">
  <!-- Shared realistic adult head, side profile facing right (talker exterior; the listener uses it mirrored).
       Light from the upper-left. Anchors: a-ear (ear canal), a-mouth. -->
  <defs>
    <radialGradient id="hd-skin" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#f8d8c3"/><stop offset=".5" stop-color="#f1c4a8"/><stop offset="1" stop-color="#d5967a"/></radialGradient>
    <linearGradient id="hd-hair" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#6b5140"/><stop offset=".45" stop-color="#3f2f25"/><stop offset="1" stop-color="#241a14"/></linearGradient>
    <linearGradient id="hd-ear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c6ab"/><stop offset="1" stop-color="#d38f73"/></linearGradient>
    <linearGradient id="hd-lip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98c84"/><stop offset="1" stop-color="#b86a63"/></linearGradient>
    <linearGradient id="hd-neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a33" stop-opacity=".3"/><stop offset="1" stop-color="#8a4a33" stop-opacity="0"/></linearGradient>
    <radialGradient id="hd-cheek" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e59a86" stop-opacity=".35"/><stop offset="1" stop-color="#e59a86" stop-opacity="0"/></radialGradient>
    <path id="hd-sil" d="M112 8C150 6 186 24 196 56C200 70 199 82 202 90C203 95 198 99 197 103C202 114 216 126 226 136C229 139 228 144 223 145C219 146 215 145 212 147C213 152 217 155 217 159.5C217 162 214.5 164.2 211.5 165C214.5 166.5 215.6 170 215.3 174C215 177.5 211 179.5 207 183C209 190 212 196 210 203C207 211 198 214 186 215C172 216 162 220 158 228C155 236 158 242 157 248C155 262 154 280 155 300L68 300C70 270 69 240 65 214C62 200 55 190 46 180C28 160 22 130 24 104C28 50 66 10 112 8Z"/>
    <clipPath id="hd-clip"><use href="#hd-sil"/></clipPath>
  </defs>
  <use href="#hd-sil" fill="url(#hd-skin)"/>
  <g clip-path="url(#hd-clip)">
    <ellipse cx="172" cy="150" rx="26" ry="20" fill="url(#hd-cheek)"/>
    <!-- shadow under the jaw and along the back of the neck -->
    <path d="M118 206C140 214 166 216 190 214L186 215C172 216 162 220 158 228L156 246C140 238 124 226 118 206Z" fill="#8a4a33" opacity=".16"/>
    <path d="M68 214C66 200 60 192 52 184C60 186 70 186 80 182L84 300L68 300C70 270 69 240 68 214Z" fill="url(#hd-neck)"/>
    <path d="M124 150C126 176 132 196 146 210" fill="none" stroke="#c4846a" stroke-width="1.2" opacity=".5"/>
  </g>
  <!-- ear -->
  <path d="M101 104C97 96 85 94 80 103C75 113 76 130 81 142C84 149 89 153 94 151.5C97.5 150 98 145 98.5 140C99 134 103.5 130 103.5 122C103.5 114 103 108 101 104Z" fill="url(#hd-ear)" stroke="#b87458" stroke-width="1"/>
  <path d="M98 108C92 103 84 106 83.5 115C83 124 86 133 91 137" fill="none" stroke="#b5735a" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M98.5 113C93 111 89.5 115 90 121C90.5 127 94 131 98.5 130.5C100.5 128 101 124 100.5 120" fill="#c98468" opacity=".75"/>
  <ellipse cx="99.2" cy="123.5" rx="2" ry="2.6" fill="#7d4232"/>
  <path d="M86 145C88 149 91 150.5 94 150" fill="none" stroke="#b87458" stroke-width=".9"/>
  <!-- eye + brow -->
  <path d="M176 99C184 97 191 98 196 100" fill="none" stroke="#c99079" stroke-width="1" opacity=".7"/>
  <path d="M178.5 104.2C182.5 101.6 188 101.3 192 103.2L192.4 106.6C188 107.8 182.5 107.4 178.5 104.2Z" fill="#fbfaf7" stroke="#6b4a3d" stroke-width=".8"/>
  <path d="M186.2 102C188.6 101.8 190.6 102.6 191.4 103.6L191.6 106.4C189.6 107.2 187.4 107.3 186 106.8C185.3 105.2 185.3 103.4 186.2 102Z" fill="#4a3426"/>
  <circle cx="189.6" cy="103.4" r=".8" fill="#fff" opacity=".9"/>
  <path d="M178 104C182.5 100.6 188.5 100.2 192.8 102.8" fill="none" stroke="#3d2a20" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M175 93.5C182 90.5 191 90 198 92.5" fill="none" stroke="#3f2f25" stroke-width="2.6" stroke-linecap="round"/>
