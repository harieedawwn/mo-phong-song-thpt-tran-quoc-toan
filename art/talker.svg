<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 300" width="232" height="300">
  <!-- Talker: realistic adult head facing right (same exterior as head.svg) with a cut-away window over the vocal tract
       (sagittal section: nasal cavity, palate, tongue, teeth, lips, oral cavity, pharynx, epiglottis, larynx, trachea, vertebrae).
       Moving layer "folds" = vocal folds (pivot a-folds-pivot), driven by u(0,t). Light from the upper-left. -->
  <defs>
    <radialGradient id="tk-skin" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#f8d8c3"/><stop offset=".5" stop-color="#f1c4a8"/><stop offset="1" stop-color="#d5967a"/></radialGradient>
    <linearGradient id="tk-hair" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#6b5140"/><stop offset=".45" stop-color="#3f2f25"/><stop offset="1" stop-color="#241a14"/></linearGradient>
    <linearGradient id="tk-ear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c6ab"/><stop offset="1" stop-color="#d38f73"/></linearGradient>
    <linearGradient id="tk-tis" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#f2bfae"/><stop offset="1" stop-color="#dd9583"/></linearGradient>
    <linearGradient id="tk-air" x1="1" y1="0" x2="0" y2=".4"><stop offset="0" stop-color="#b9717a"/><stop offset=".55" stop-color="#9a5562"/><stop offset="1" stop-color="#7c3c4b"/></linearGradient>
    <linearGradient id="tk-bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#e3d3b1"/></linearGradient>
    <linearGradient id="tk-cart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f7fa"/><stop offset="1" stop-color="#bccbd7"/></linearGradient>
    <radialGradient id="tk-tongue" cx=".45" cy=".3" r=".75"><stop offset="0" stop-color="#ee9aa0"/><stop offset=".6" stop-color="#d9727a"/><stop offset="1" stop-color="#b54f59"/></radialGradient>
    <linearGradient id="tk-muc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4aeb1"/><stop offset="1" stop-color="#d4717a"/></linearGradient>
    <linearGradient id="tk-tooth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#e6dbc0"/></linearGradient>
    <linearGradient id="tk-lip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d98c84"/><stop offset="1" stop-color="#b86a63"/></linearGradient>
    <linearGradient id="tk-cord" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4f1"/><stop offset=".6" stop-color="#f1c9c6"/><stop offset="1" stop-color="#cf8b8f"/></linearGradient>
    <linearGradient id="tk-neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a33" stop-opacity=".28"/><stop offset="1" stop-color="#8a4a33" stop-opacity="0"/></linearGradient>
    <filter id="tk-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <path id="tk-sil" d="M112 8C150 6 186 24 196 56C200 70 199 82 202 90C203 95 198 99 197 103C202 114 216 126 226 136C229 139 228 144 223 145C219 146 215 145 212 147C213 152 217 155 217 159.5C217 162 214 163 210 163L206 165.5L210.5 168.5C213.5 169 215.6 171 215.3 174C215 177.5 211 179.5 207 183C209 190 212 196 210 203C207 211 198 214 186 215C172 216 162 220 158 228C155 236 158 242 157 248C155 262 154 280 155 300L68 300C70 270 69 240 65 214C62 200 55 190 46 180C28 160 22 130 24 104C28 50 66 10 112 8Z"/>
    <clipPath id="tk-head"><use href="#tk-sil"/></clipPath>
    <clipPath id="tk-win"><path d="M121 113C150 109 178 113 200 108L240 104L240 300L80 300C81 252 84 206 92 181C100 160 111 138 121 113Z"/></clipPath>
  </defs>

  <!-- hair (back), skin, ear, face details -->
  <use href="#tk-sil" fill="url(#tk-skin)"/>
  <path d="M68 214C66 200 60 192 52 184C60 186 70 186 80 182L84 300L68 300C70 270 69 240 68 214Z" fill="url(#tk-neck)"/>
  <!-- ear -->
  <path d="M101 104C97 96 85 94 80 103C75 113 76 130 81 142C84 149 89 153 94 151.5C97.5 150 98 145 98.5 140C99 134 103.5 130 103.5 122C103.5 114 103 108 101 104Z" fill="url(#tk-ear)" stroke="#b87458" stroke-width="1"/>
  <path d="M98 108C92 103 84 106 83.5 115C83 124 86 133 91 137" fill="none" stroke="#b5735a" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M98.5 113C93 111 89.5 115 90 121C90.5 127 94 131 98.5 130.5C100.5 128 101 124 100.5 120" fill="#c98468" opacity=".75"/>
  <ellipse cx="99.2" cy="123.5" rx="2" ry="2.6" fill="#7d4232"/>
  <path d="M86 145C88 149 91 150.5 94 150" fill="none" stroke="#b87458" stroke-width=".9"/>
  <!-- eye + brow -->
  <path d="M176 99C184 97 191 98 196 100" fill="none" stroke="#c99079" stroke-width="1" opacity=".7"/>
  <path d="M178.5 104.2C182.5 101.6 188 101.3 192 103.2L192.4 106.6C188 107.8 182.5 107.4 178.5 104.2Z" fill="#fbfaf7" stroke="#6b4a3d" stroke-width=".8"/>
  <path d="M186.2 102C188.6 101.8 190.6 102.6 191.4 103.6L191.6 106.4C189.6 107.2 187.4 107.3 186 106.8C185.3 105.2 185.3 103.4 186.2 102Z" fill="#4a3426"/>
  <circle cx="189.6" cy="103.4" r=".8" fill="#fff" opacity=".9"/>
  <path d="M178 104C182.5 100.6 188.5 100.2 192.8 102.8" fill="none" stroke="#3d2a20" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M175 93.5C182 90.5 191 90 198 92.5" fill="none" stroke="#3f2f25" stroke-width="2.6" stroke-linecap="round"/>

  <!-- cut-away window: sagittal section of the vocal tract -->
  <g clip-path="url(#tk-head)"><g clip-path="url(#tk-win)">
    <rect x="70" y="100" width="170" height="200" fill="url(#tk-tis)"/>
    <!-- spinal cord, discs, vertebral bodies, clivus -->
    <rect x="89.5" y="138" width="8.5" height="164" rx="4" fill="#f4e6bd" stroke="#c4ab70" stroke-width=".8"/>
    <path d="M127 112L147 113C141 120 131 132 124 146L112 145C116 133 121 121 127 112Z" fill="url(#tk-bone)" stroke="#a08a62" stroke-width=".9"/>
    <rect x="101" y="156" width="15.5" height="144" fill="#dbe4ea"/>
    <g fill="url(#tk-bone)" stroke="#a08a62" stroke-width=".9">
      <rect x="103" y="143" width="9" height="15" rx="4"/>
      <ellipse cx="116.8" cy="150.5" rx="4" ry="4.6"/>
      <rect x="100" y="156" width="17" height="25" rx="3"/>
      <rect x="100.5" y="185" width="17" height="15" rx="3"/>
      <rect x="101" y="204" width="17" height="15" rx="3"/>
      <rect x="101" y="223" width="17" height="15" rx="3"/>
      <rect x="100.5" y="242" width="17" height="15" rx="3"/>
      <rect x="100" y="261" width="17" height="15" rx="3"/>
      <rect x="99" y="280" width="17.5" height="16" rx="3"/>
    </g>
    <!-- airway: nasal cavity → pharynx → larynx → trachea, + oral cavity -->
    <path d="M204 146C208 140 210 132 206 124C202 119 192 117 180 117C165 117 150 118 140 121C130 123 124 128 122 137C120 155 121 180 122 205C123 222 124 234 125 240C128 241 131 243 131 247L132 300L148 300L147 262C146 252 146 244 145 238C143 232 142 227 142 222C150 222 170 210 186 198C194 190 199 180 201 171L206 165.5L214 165.5L214 163C211 162.6 208.5 162 207 161C205 156 204 153 202 152C190 151.5 165 151 150 151C148 150 147.5 147 148 146C165 145.5 190 145.5 204 146Z" fill="url(#tk-air)" stroke="#e98f93" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M204 146C208 140 210 132 206 124C202 119 192 117 180 117C165 117 150 118 140 121C130 123 124 128 122 137C120 155 121 180 122 205C123 222 124 234 125 240C128 241 131 243 131 247L132 300M148 300L147 262C146 252 146 244 145 238" fill="none" stroke="#a84f5c" stroke-width=".7"/>
    <!-- nasal conchae -->
    <g fill="url(#tk-muc)" stroke="#b9606a" stroke-width=".7">
      <path d="M150 121C158 119 168 119 173 121.5C168 124 158 124.5 150 123.5Z"/>
      <path d="M146 127C158 124 178 124 189 127.5C181 131.5 160 132 147 130.5Z"/>
      <path d="M146 135.5C160 132 186 132 199 136.5C191 141 162 141.5 147 140Z"/>
    </g>
    <!-- nose cartilage + nasal bone -->
    <path d="M198 106C204 114 214 125 222 134" fill="none" stroke="url(#tk-cart)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M196.5 104C198 108 200 111 202.5 114" fill="none" stroke="#e8dcc0" stroke-width="3.4" stroke-linecap="round"/>
    <!-- hard palate, mandible (chin), hyoid -->
    <path d="M203 146.3C190 146 165 146 150 146.3C148 147 148 150 150 150.8C165 150.7 190 151 202 151.6C204 150 204 148 203 146.3Z" fill="url(#tk-bone)" stroke="#a08a62" stroke-width=".9"/>
    <path d="M203.5 182C206.5 188 207.5 197 205.5 204C203.5 209.5 198 211 193 210C189.5 209 188.5 205.5 190 201.5C193 195 198 189 200.5 182Z" fill="url(#tk-bone)" stroke="#a08a62" stroke-width=".9"/>
    <path d="M202.5 188C204 194 204 200 202.5 204.5C200.5 207.5 196.5 208 194 206.5C193 204.5 194 201.5 196 198.5C198.5 195 200.5 191.5 202.5 188Z" fill="#e8d7b2" opacity=".8"/>
    <ellipse cx="158.5" cy="226.5" rx="4.6" ry="2.8" fill="url(#tk-bone)" stroke="#a08a62" stroke-width=".9"/>
    <!-- larynx cartilages: thyroid, cricoid, arytenoid, trachea rings; esophagus -->
    <g fill="url(#tk-cart)" stroke="#7f909e" stroke-width=".8">
      <path d="M149 232C152 236 154.5 246 154.5 256C154.5 261 152.5 264 150.5 264L148.5 262C149 252 149 242 148.5 234Z"/>
      <ellipse cx="151" cy="270.5" rx="3" ry="4.4"/>
      <path d="M128 254L131.6 254L132.2 280L128.4 278Z"/>
      <path d="M127.5 244.5L131 247.5L131.4 253L127.6 252Z"/>
      <rect x="148.6" y="279" width="4.2" height="4.2" rx="1.6"/>
      <rect x="148.8" y="286.5" width="4.2" height="4.2" rx="1.6"/>
      <rect x="149" y="294" width="4.2" height="4.2" rx="1.6"/>
    </g>
    <path d="M125.5 246C126 262 126.6 280 126.8 302" fill="none" stroke="#b45d68" stroke-width="1.6" stroke-linecap="round"/>
    <!-- tongue, soft palate (velum + uvula), epiglottis -->
    <path d="M200 172C196 166 187 162 177 161.5C165 161 153 163 147 168C142 173 141 181 141 190C141 202 141 212 142 220C143.5 226 148 228 152 226C166 220 180 210 191 196C196 189 200 181 200 172Z" fill="url(#tk-tongue)" stroke="#9c3d46" stroke-width=".9"/>
    <path d="M186 170C176 169 164 171 155 177M180 184C170 184 160 188 152 196M172 198C164 200 156 206 150 213" fill="none" stroke="#c45d66" stroke-width=".8" opacity=".55"/>
    <path d="M195 166C186 163.5 168 163 153 167" fill="none" stroke="#fbd0d2" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>
    <path d="M152.5 146C146 147 140 152 137 160C135 165 134 170 136 172.5C139 173.5 141 168.5 143 163C146 157 150 153.5 153 151.5Z" fill="url(#tk-muc)" stroke="#a84f5c" stroke-width=".8"/>
    <path d="M145.5 238C141 230 136 222 132 213C131 210 133.5 209.2 135.2 211.2C139 219 144 228 148.5 236Z" fill="url(#tk-muc)" stroke="#a84f5c" stroke-width=".8"/>
    <!-- false vocal fold + ventricle (static) -->
    <path d="M131.5 246.6C136 245.6 142 245.8 146 247L146 249.4C142 248.8 136 248.8 131.5 249.7Z" fill="url(#tk-muc)" stroke="#a84f5c" stroke-width=".6"/>
    <ellipse cx="139" cy="251.6" rx="6.2" ry="1.3" fill="#5e2531" opacity=".55"/>
    <!-- teeth -->
    <g fill="url(#tk-tooth)" stroke="#a8996f" stroke-width=".7">
      <path d="M202.5 147.5C204.3 147.5 205.8 150 206.8 154L209.6 162.3C209.2 163.8 207.6 164.2 206.7 163.3C204.8 160 203.2 156 202.2 152.2C201.8 150.2 201.8 148.4 202.5 147.5Z"/>
      <path d="M204 184C203 180 203 175 204.4 171L206.4 166.2C207.4 165.6 208.4 166 208.5 167C208.3 172 207.6 177 207.2 184Z"/>
    </g>
    <!-- lips (vermilion) -->
    <path d="M212.5 152.5C215 154.8 217 157 217 159.5C217 162 214 163 210 163C211.4 160 212.3 156.5 212.5 152.5Z" fill="url(#tk-lip)"/>
    <path d="M210.5 168.5C213.5 169 215.6 171 215.3 174C215 177 212.5 178.6 209.8 178.2C211.2 175 211.4 171.5 210.5 168.5Z" fill="url(#tk-lip)"/>
    <!-- skin rim along the profile + soft shadow inside the cut edge -->
    <use href="#tk-sil" fill="none" stroke="#e7ab8f" stroke-width="3.2"/>
    <path d="M121 113C150 109 178 113 200 108L240 104M80 300C81 252 84 206 92 181C100 160 111 138 121 113" fill="none" stroke="#5a2a20" stroke-opacity=".35" stroke-width="5" filter="url(#tk-soft)"/>
  </g></g>
  <!-- cut edge + head outline -->
  <g clip-path="url(#tk-head)"><path d="M121 113C150 109 178 113 200 108L240 104M80 300C81 252 84 206 92 181C100 160 111 138 121 113" fill="none" stroke="#7a3f35" stroke-width="1.3"/></g>
  <use href="#tk-sil" fill="none" stroke="#9c5b43" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- hair over the scalp -->
  <path d="M40 166C26 142 18 112 22 84C30 32 76 1 122 2.5C160 3.5 188 18 194 42C186 38 176 40 168 46C152 52 138 62 130 78C126 88 125 98 124 108L119 112C116 104 112 96 104 92C96 88 86 90 79 98C70 110 62 128 58 146C55 156 50 163 40 166Z" fill="url(#tk-hair)" stroke="#221812" stroke-width=".8"/>
  <path d="M60 30C80 14 104 8 128 9" fill="none" stroke="#a08068" stroke-width="2" stroke-linecap="round" opacity=".45"/>

  <!-- moving: vocal folds (true folds), vibrate with u(0,t) -->
  <g id="folds" data-move="1">
    <path d="M131.6 253.4C136 252.2 142 252.2 146.4 253.4L146.4 256.8C142 258 136 258 131.6 256.8Z" fill="url(#tk-cord)" stroke="#a8545c" stroke-width=".6"/>
    <path d="M132.5 254C136.5 253.2 141.5 253.2 145.5 254" fill="none" stroke="#fff" stroke-width=".7" opacity=".9"/>
  </g>

  <circle class="anchor" id="a-folds-pivot" cx="139" cy="255" r="0"/>
  <circle class="anchor" id="a-mouth" cx="211" cy="165.8" r="0"/>
  <circle class="anchor" id="a-cords" cx="139" cy="255" r="0"/>
  <circle class="anchor" id="a-throat" cx="127" cy="196" r="0"/>
  <circle class="anchor" id="a-oral" cx="180" cy="154" r="0"/>
  <circle class="anchor" id="a-nasal" cx="170" cy="143" r="0"/>
  <circle class="anchor" id="a-tongue" cx="170" cy="178" r="0"/>
</svg>
