<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 200" width="156" height="200">
  <defs>
    <linearGradient id="spkout-box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f56"/><stop offset=".45" stop-color="#2c3036"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <linearGradient id="spkout-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3e44"/><stop offset=".5" stop-color="#2a2d32"/><stop offset="1" stop-color="#202327"/></linearGradient>
    <linearGradient id="spkout-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2d32"/><stop offset=".5" stop-color="#6b7179"/><stop offset="1" stop-color="#15171a"/></linearGradient>
    <filter id="spkout-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="78" cy="196" rx="72" ry="4" fill="#2b2418" opacity=".28" filter="url(#spkout-blur)"/>
  <rect x="12" y="190" width="18" height="6" rx="2" fill="#0f1012"/><rect x="118" y="190" width="18" height="6" rx="2" fill="#0f1012"/>
  <!-- closed cabinet seen from the side: the front baffle is the right edge -->
  <rect x="5" y="10" width="143" height="180" rx="7" fill="url(#spkout-side)" stroke="#0e0f11" stroke-width="1"/>
  <rect x="136" y="10" width="12" height="180" rx="4" fill="url(#spkout-box)" stroke="#0e0f11" stroke-width="1"/>
  <rect x="8" y="12" width="136" height="3" rx="1.5" fill="#fff" opacity=".22"/>
  <rect x="138" y="13" width="3" height="174" rx="1.5" fill="#fff" opacity=".18"/>
  <path d="M30 40v120M42 40v120M54 40v120" stroke="#fff" stroke-width="1" opacity=".05"/>
  <!-- driver edge-on: the cone rim + surround ring bulges out of the baffle and moves with u(0,t) -->
  <g id="cone" data-move="1">
    <rect x="138" y="44" width="8" height="112" rx="3.5" fill="url(#spkout-ring)" stroke="#0a0b0c" stroke-width=".9"/>
    <rect x="140" y="46" width="2" height="108" rx="1" fill="#fff" opacity=".35"/>
  </g>
  <circle class="anchor" id="a-rimtop" cx="146" cy="44" r="0"/>
  <circle class="anchor" id="a-rimbot" cx="146" cy="156" r="0"/>
  <circle class="anchor" id="a-cone" cx="142" cy="70" r="0"/>
  <circle class="anchor" id="a-box" cx="70" cy="150" r="0"/>
</svg>
